[tool.ruff]
target-version = "py311"
line-length = 100
force-exclude = true
include = ["smart_building_conformal/tests/**/*.py", "tools/**/*.py"]
# Saved experiment identities include the exact scientific source bytes.
extend-exclude = [
    "smart_building_conformal/src",
    "smart_building_conformal/outputs",
    "smart_building_conformal/protocols",
    "smart_building_conformal/scripts",
    "review",
    "report_figures",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
