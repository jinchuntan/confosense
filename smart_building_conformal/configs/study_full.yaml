# Master configuration for the full ConfoSense dissertation study.
#
# `defaults` holds everything shared by every dataset; each block under
# `datasets` overrides only what genuinely differs for that source. The
# per-dataset configs (pleia_full.yaml, rico_full.yaml, bdg2_full.yaml) extend
# this file and narrow it to one dataset, so nothing is duplicated.
#
# The preliminary experiment is NOT configured here. It keeps
# configs/pleia_preliminary.yaml and writes to outputs/ ; the full study writes
# to outputs/full_study/ and never overwrites it.

seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  full_study_dir: outputs/full_study

defaults:
  seed: 42

  paths:
    raw_dir: data/raw
    interim_dir: data/interim
    processed_dir: data/processed

  split:
    train_frac: 0.6
    calib_frac: 0.2            # test is the remaining 0.2

  missing:
    max_short_gap_steps: 3

  coverage_levels: [0.90, 0.95]

  features:
    target_lags: [1, 2, 3, 6, 12]
    rolling_windows: [6, 144]
    include_weekly: true

  models:
    xgboost:
      search_iter: 20
      cv_splits: 3
      seeds: 5
      # Determinism: XGBoost's `hist` reduction order depends on thread count,
      # so the same seed gives different models at different core counts.
      # Refits are single-threaded for the full study; the search stays parallel
      # because each candidate fit inside it is already single-threaded.
      refit_n_jobs: 1
      search_n_jobs: -1
    lstm:
      seq_len: 24
      hidden_size: 64
      dropout: 0.2
      batch_size: 256
      learning_rate: 0.001
      max_epochs: 30
      patience: 5
      val_fraction: 0.2
      seeds: 3                 # fewer than XGBoost because of CPU training cost

  conformal:
    cqr:
      seeds: 5
    enbpi:
      n_resamplings: 20
      block_length: 48
      base_n_estimators: 200
      base_max_depth: 5
      base_learning_rate: 0.05
      update_step: 48
      seeds: 3
      n_jobs: 4
    dscp:
      # Dual-Splitting Conformal Prediction (Yu et al. 2025). max_clusters bounds
      # the vertical k-means split; ks_threshold is the two-sample KS p-value
      # above which adjacent steps are merged horizontally.
      max_clusters: 6
      ks_threshold: 0.05
      # null follows the paper, which sets the soft-DTW neighbourhood to the
      # size of the smallest cluster. An integer overrides it.
      neighbours: null
      gamma: 1.0

  alerts:
    primary_method: "cqr"
    primary_level: 0.95
    detection_tolerance_steps: 6
    max_false_alerts_per_day: 1.0
    candidate_rules: ["1-of-1", "2-of-3", "3-of-5", "4-of-7"]
    selection:
      # Nested, chronological split *inside* the calibration partition: the
      # earlier 60% conformalizes a separate CQR model, the later 40% scores the
      # candidate rules. Scoring rules on the same residuals that set the
      # conformal quantile would report an optimistic violation rate. 60/40
      # leaves both blocks in the thousands of windows on every dataset here;
      # below `min_samples_per_block` the study falls back to the pooled
      # construction and records that as a limitation rather than choosing a
      # rule from too few points.
      calibration_conformal_fraction: 0.6
      min_samples_per_block: 200
    events:
      instances_per_type: 3
      spike_sds: [4.0]
      bias_sds: [0.5, 1.0, 2.0]
      bias_steps: 18
      level_shift_sds: [0.5, 1.0, 2.0]
      level_shift_steps: 12
      drift_sds: [1.0, 2.0]
      drift_steps: 36
      stuck_steps: 18
      dropout_steps: 12
      warmup_steps: 6
      guard_steps: 6

  recalibration:
    recovery_block: 144
    grid:
      update_every: [24, 48, 144]
      window: [250, 500, 1000]
      min_samples: 50

  robustness:
    modes: ["legacy_fixed_intervals", "closed_loop"]
    random_missing: [0.05, 0.10, 0.20]
    block_missing: [0.05, 0.10]
    block_steps: 12
    bias_sds: [0.5, 1.0, 2.0]
    level_shift_sds: [1.0, 2.0]
    drift_sds: [1.0, 2.0]
    stuck_fractions: [0.05]
    dropout_fractions: [0.05]
    calibration_contamination: [0.01, 0.05, 0.10]

  bootstrap:
    n_boot: 1000
    ci: 0.95

  plotting:
    window_steps: 144

# --------------------------------------------------------------------------- #
datasets:

  # ---- PLEIAData indoor temperature: the preliminary target, unchanged ------
  pleia:
    adapter: pleia
    target_kind: temperature
    horizons: [1, 3, 6]          # 10, 30, 60 minutes at 10-min sampling
    resample:
      freq: "10min"
      season_steps: 144
    outliers:
      target_min: 15.0
      target_max: 40.0
    dataset:
      zenodo_record_id: "7620136"
      room_all_file: "Data_Nature/processed_data/data-room10T-all.csv"
      csv_sep: ";"
      timestamp_col: "Date"
      block_col: "block"
      room_col: "room"
      target_var: "V2"
    target_selection:
      min_std: 0.5
      min_valid_obs: 5000
    covariates:
      outdoor_temp: "tmed"
      humidity: "hrmed"
      radiation: "radmed"
      hvac_state: "V4"
      setpoint: "V12"
      hvac_mode_onehot: ["V5_0", "V5_1", "V5_2"]
    alerts:
      primary_horizon: 1         # operating point: 10 minutes ahead

  # ---- PLEIAData energy consumption ---------------------------------------
  pleia_energy:
    adapter: pleia
    target_kind: energy
    horizons: [1, 3, 6]
    resample:
      freq: "10min"
      season_steps: 144
    dataset:
      csv_sep: ";"
      timestamp_col: "Date"
      target_var: "dif_cons"
    energy:
      block_rule: match_temperature_block
      block: "B"
      value_col: "dif_cons"
      file_pattern: "Data_Nature/processed_data/cons{block}-10T.csv"
      weather_file: "Data_Nature/processed_data/data-weather-10T.csv"
      weather_covariates: ["tmed", "hrmed", "radmed"]
    covariates:
      outdoor_temp: "tmed"
      humidity: "hrmed"
      radiation: "radmed"
      hvac_state: "V4"
      setpoint: "V12"
      hvac_mode_onehot: []
    alerts:
      primary_horizon: 1

  # ---- RICO HVAC ------------------------------------------------------------
  rico:
    adapter: rico
    horizons: [5, 15, 30, 60]    # minutes; sampling is verified to be 1 min
    resample:
      freq: "1min"
      season_steps: null         # a 4 h run holds no daily cycle
    rico:
      subdir: rico
      freq: "1min"
      target_column: "B.RTD3"    # documented Pt100 air sensor at 110 cm, cell B
      min_run_length: 120
      auto_download: true
    features:
      target_lags: [1, 2, 3, 5, 10]
      rolling_windows: [10, 30]
      include_weekly: false
    models:
      lstm:
        seq_len: 20
    alerts:
      primary_horizon: 5         # operating point: 5 minutes ahead
      detection_tolerance_steps: 10
      events:
        bias_steps: 20
        level_shift_steps: 15
        drift_steps: 30
        stuck_steps: 20
        dropout_steps: 15
        warmup_steps: 15
        guard_steps: 5
    recalibration:
      recovery_block: 60
      grid:
        update_every: [15, 30, 60]
        window: [200, 500]
        min_samples: 50
    robustness:
      block_steps: 10

  # ---- BDG2 cross-building energy ------------------------------------------
  bdg2:
    adapter: bdg2
    horizons: [1, 3, 6]          # hours; sampling is verified to be hourly
    resample:
      freq: "1h"
      season_steps: 24
    bdg2:
      subdir: bdg2
      freq: "1h"
      season_steps: 24
      auto_download: true
      use_weather: true
      weather_covariates: ["airTemperature", "dewTemperature"]
      selection:
        n_buildings: 10
        min_span_days: 300
        min_coverage: 0.95
        max_constant_fraction: 0.5
        max_per_site: 2
        require_documented_use: true
    features:
      target_lags: [1, 2, 3, 6, 12, 24]
      rolling_windows: [6, 24]
      include_weekly: true
    models:
      lstm:
        seq_len: 24
    alerts:
      primary_horizon: 1         # operating point: 1 hour ahead
      detection_tolerance_steps: 3
      events:
        bias_steps: 12
        level_shift_steps: 8
        drift_steps: 24
        stuck_steps: 12
        dropout_steps: 8
        warmup_steps: 24
        guard_steps: 4
    recalibration:
      recovery_block: 24
      grid:
        update_every: [12, 24, 48]
        window: [200, 500]
        min_samples: 50
